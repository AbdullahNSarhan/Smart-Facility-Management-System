# ==============================================================================
# LCI-SFM Eclipse Mosquitto 2.x Production Broker Configuration
# Air-Gapped LAN Operation with Mandatory Password Authentication & Topic ACLs
# ==============================================================================

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ

# Primary MQTT Listener (Air-Gapped LAN / Docker Internal Bridge)
listener 1883 0.0.0.0
protocol mqtt

# Security: Disable anonymous access and enforce per-identity ACLs
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Resource & Payload Bounds
max_packet_size 65536
max_inflight_messages 40
max_queued_messages 500
persistent_client_expiration 7d
