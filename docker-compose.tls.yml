# Optional Local LAN HTTPS/TLS Compose Override
# Usage:
#   sudo ./scripts/setup-local-tls.sh 192.168.10.20 lci-sfm.local
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d

services:
  frontend_dashboard:
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_TLS_PORT:-443}:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
