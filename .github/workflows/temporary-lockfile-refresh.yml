name: Temporary root lockfile refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-root-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate and validate root npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (!root) throw new Error('Lockfile v3 root package entry is missing');
          for (const key of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            const expected = pkg[key] ?? {};
            const actual = root[key] ?? {};
            if (JSON.stringify(expected) !== JSON.stringify(actual)) {
              throw new Error(`Root ${key} do not match package.json`);
            }
          }
          if (lock.version !== pkg.version || root.version !== pkg.version) {
            throw new Error('Lockfile package version does not match package.json');
          }
          console.log(`Lockfile synchronized: ${Object.keys(lock.packages).length} package entries`);
          NODE

      - name: Commit the synchronized lockfile and remove this temporary workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/temporary-lockfile-refresh.yml
          git diff --cached --check
          git commit -m "fix: synchronize root npm lockfile for reproducible installs"
          git push origin "HEAD:${HEAD_BRANCH}"
