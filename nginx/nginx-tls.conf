# ==============================================================================
# LCI-SFM Optional Local LAN HTTPS/TLS Nginx Configuration
# Use via: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Certificates generated by: sudo ./scripts/setup-local-tls.sh <LAN_IP> [HOSTNAME]
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 128k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream lci_backend_upstream {
        server backend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
        location ~* \.(db|sqlite|sqlite3|sql|env|yml|yaml|md|sh|conf|key|pem)$ {
            deny all;
            return 404;
        }

        location /api/ {
            proxy_pass http://lci_backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location /ws/ {
            proxy_pass http://lci_backend_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
