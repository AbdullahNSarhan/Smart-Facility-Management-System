# ==============================================================================
# LCI-SFM Hardened Nginx Reverse Proxy & Static Asset Configuration
# Serves compiled frontend assets (/usr/share/nginx/html) and reverse-proxies
# same-origin /api/* and /ws/* to the internal Node.js backend service.
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 128k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream lci_backend_upstream {
        server backend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;

        # Explicit deny rules for sensitive paths if ever present
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
        location ~* \.(db|sqlite|sqlite3|sql|env|yml|yaml|md|sh|conf)$ {
            deny all;
            return 404;
        }

        # Reverse Proxy: REST API (/api/*) -> Node.js Backend
        location /api/ {
            proxy_pass http://lci_backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Reverse Proxy: WebSocket Streams (/ws/telemetry, /ws/mfa) -> Node.js Backend
        location /ws/ {
            proxy_pass http://lci_backend_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Static Frontend Console Assets
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
